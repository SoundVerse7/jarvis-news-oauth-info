name: Refresh headlines and public YouTube videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-headlines.yml"
      - "scripts/update_headlines.py"
      - "scripts/update_videos.py"
      - "assets/newsroom.js"
      - "assets/channels.js"
      - "index.html"
      - "channels.html"
      - "videos.html"
      - "scripts/test_site.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: public-mind-headline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check newsroom JavaScript syntax
        run: node --check assets/newsroom.js
      - name: Check Python feed builder syntax
        run: python -m py_compile scripts/update_headlines.py scripts/update_videos.py
      - name: Validate channel IDs and public website links
        run: python scripts/test_site.py
      - name: Fetch official-source headlines
        run: python scripts/update_headlines.py
      - name: Fetch both public YouTube video feeds
        run: python scripts/update_videos.py
      - name: Check channel video JavaScript syntax
        run: node --check assets/channels.js
      - name: Commit updated source-linked headlines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/headlines.json data/videos.json
          if git diff --cached --quiet; then
            echo "No change in public feed."
            exit 0
          fi
          git commit -m "Update public news and channel video snapshots"
          # Edits to the website may land while this job is running.
          # Never overwrite those edits; replay only the feed commit before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Published public feed data"
              exit 0
            fi
            echo "Branch moved while publishing; retrying ($attempt/3)"
            sleep 3
          done
          echo "Could not publish safely after retries" >&2
          exit 1
