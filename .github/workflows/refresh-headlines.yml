name: Refresh headlines and public YouTube videos

on:
  workflow_dispatch:
  # An authenticated, owner-authorized JARVIS installation can later notify
  # this repository AFTER confirming the video is public on the correct channel.
  repository_dispatch:
    types: [jarvis_public_video]
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-headlines.yml"
      - "scripts/update_headlines.py"
      - "scripts/update_videos.py"
      - "scripts/ingest_publication.py"
      - "scripts/merge_snapshots.py"
      - "data/jarvis_public.json"
      - "assets/newsroom.js"
      - "assets/channels.js"
      - "index.html"
      - "channels.html"
      - "videos.html"
      - "scripts/test_site.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: public-mind-headline-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Synchronize latest public data on this disposable runner
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check newsroom JavaScript syntax
        run: node --check assets/newsroom.js
      - name: Check Python feed builder syntax
        run: python -m py_compile scripts/update_headlines.py scripts/update_videos.py scripts/ingest_publication.py scripts/merge_snapshots.py
      - name: Validate channel IDs and public website links
        run: python scripts/test_site.py
      - name: Accept authorized public-only video notification
        if: github.event_name == 'repository_dispatch'
        env:
          JARVIS_PUBLIC_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/ingest_publication.py
      - name: Fetch official-source headlines
        run: python scripts/update_headlines.py
      - name: Fetch both public YouTube video feeds
        run: python scripts/update_videos.py
      - name: Check channel video JavaScript syntax
        run: node --check assets/channels.js
      - name: Safely publish verified public snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/headlines.json "$RUNNER_TEMP/headlines-new.json"
          cp data/videos.json "$RUNNER_TEMP/videos-new.json"
          cp data/jarvis_public.json "$RUNNER_TEMP/jarvis-new.json"
          for attempt in 1 2 3 4; do
            git fetch --no-tags origin main
            # Only reset the disposable GitHub runner; never touch a user's PC.
            git reset --hard origin/main
            # Combine new and existing owner-published videos by ID. Never
            # overwrite unrelated site edits or replace newer RSS snapshots.
            python scripts/merge_snapshots.py "$RUNNER_TEMP" data
            git add data/headlines.json data/videos.json data/jarvis_public.json
            if git diff --cached --quiet; then
              echo "Nothing new to publish."
              exit 0
            fi
            git commit -m "Refresh source-linked news and public channel videos"
            if git push origin HEAD:main; then
              echo "Published public data without overwriting website edits."
              exit 0
            fi
            echo "Another commit landed; retrying against the latest branch ($attempt/4)"
            sleep 2
          done
          echo "Could not publish public feed snapshot after safe retries" >&2
          exit 1
